name: nutriapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.1
  flutter_svg: ^2.1.0
  smooth_page_indicator: ^1.2.1
  lottie: ^3.3.1
  logger: ^2.5.0
  flutter_unit_ruler: ^1.0.1
  video_player: ^2.9.5
  fl_chart: ^1.0.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  http: ^1.4.0
  firebase_auth: ^6.1.2
  camera: ^0.11.2
  tflite_flutter: ^0.12.1
  image: ^4.5.4
  chat_gpt_sdk: ^3.1.5
  material_buttonx: ^2.0.3
  vector_math: ^2.1.4
  cloud_firestore: ^6.1.0
  file_picker: ^10.3.7
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1
  saver_gallery: ^4.1.0
  share_plus: ^12.0.1
  cloud_functions: ^6.0.4
  flutter_stripe: ^12.1.1
  permission_handler: ^12.0.1
  speech_to_text: ^7.3.0
  image_picker: ^1.2.1
  csv: ^6.0.0
  rxdart: ^0.28.0
  flutter_launcher_icons: ^0.14.4
  sqflite: ^2.4.2
  path: ^1.9.1
  easy_localization: ^3.0.8
  flutter_local_notifications: ^22.3.1
  pdf: ^3.11.1
  printing: ^5.13.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/n-logo.png" 
  
  adaptive_icon_background: "#FFFFFF" 
  
  adaptive_icon_foreground: "assets/images/launcher-icon.png"


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/translations/
    - assets/nutrition_dataset.csv
    - assets/fyp_meal_plan.csv
    - assets/fyp_indian_meal_plan.csv
    - assets/fyp_pakistan_meal_plan.csv
    - assets/fyp_keto_meal_plan.csv
    - assets/fyp_mediterranean_meal_plan.csv
    - assets/fyp_dash_meal_plan.csv
    - assets/pakistani_dish_gi_tags.csv
    - assets/indian_dish_gi_tags.csv
    - assets/keto_dish_gi_tags.csv
    - assets/mediterranean_dish_gi_tags.csv
    - assets/dash_dish_gi_tags.csv
    - assets/best_float32.tflite
    - assets/calorie_model.tflite
    - assets/api-key.env 